<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PL Predict — Matchweek 3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f7;color:#171717}
header{background:#3d195b;color:#fff;padding:22px 18px}h1{margin:0;font-size:28px}.sub{opacity:.88;margin-top:5px}
.wrap{max-width:780px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
.notice{background:#eee6f5;border-left:5px solid #3d195b;padding:13px;border-radius:10px;margin:14px 0}
.players button,.submit{border:0;border-radius:10px;padding:11px 15px;margin:4px;background:#eee;cursor:pointer;font-weight:700}
.players button.active,.submit{background:#3d195b;color:#fff}.submit{width:100%;font-size:16px;padding:14px;margin-top:12px}
.match{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.match:first-child{border-top:0}
.teams{font-weight:700}.kick{font-size:12px;color:#777;margin-top:4px}.score{display:flex;gap:5px}.score input{width:48px;padding:10px;border:1px solid #ccc;border-radius:8px;text-align:center;font-size:18px}
.small{font-size:13px;color:#666}.ok{background:#e8f5e9;border-left:5px solid #2e7d32;padding:11px;border-radius:8px}.warn{background:#fff3cd;border-left:5px solid #b8860b;padding:11px;border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}
.revealRow{display:grid;grid-template-columns:1fr 90px 55px;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
@media(max-width:520px){.match{grid-template-columns:1fr 105px}.teams{font-size:15px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚽ PL Predict</h1><div class="sub">Premier League • Matchweek 3 • 4–6 September 2026</div></div></header>
<div class="wrap">
<div id="notice" class="notice">Connecting…</div>

<div class="card">
<h2 style="margin-top:0">1. Choose your name</h2>
<div id="players" class="players"></div>
<div id="claimStatus" class="small"></div>
</div>

<div class="card">
<h2 style="margin-top:0">2. Enter your predictions</h2>
<div id="fixtures"></div>
<button class="submit" id="submitBtn">🔒 Submit & Lock Predictions</button>
<div id="status"></div>
</div>

<div class="card">
<h2 style="margin-top:0">👀 Reveal</h2>
<div id="reveal"></div>
</div>

<div class="card">
<h2 style="margin-top:0">🏆 Leaderboard</h2>
<table><thead><tr><th>Player</th><th>Points</th></tr></thead><tbody id="leaderboard"></tbody></table>
<p class="small">Correct result = 6 points. Exact score = 10 bonus, so an exact score is 16 points.</p>
</div>
</div>

<script>
const SUPABASE_URL = "https://ekbwbibmicqfrompglyq.supabase.co";
const SUPABASE_KEY = "sb_publishable_3_9tReCoYfbZG5if1PKAPQ_am8pb55g";
const GAME_ID = "mw3-2026";
const PLAYERS = ["Joe","Josh","Russ","Scott"];
const REVEAL_AT = new Date("2026-09-04T19:00:00Z");
const FIXTURES = [
["Ipswich Town","Liverpool","4 Sep • 20:00"],
["Newcastle United","AFC Bournemouth","5 Sep • 12:30"],
["Brentford","Sunderland","5 Sep • 15:00"],
["Brighton & Hove Albion","Leeds United","5 Sep • 15:00"],
["Fulham","Crystal Palace","5 Sep • 15:00"],
["Manchester City","Coventry City","5 Sep • 15:00"],
["Nottingham Forest","Tottenham Hotspur","5 Sep • 15:00"],
["Hull City","Aston Villa","5 Sep • 17:30"],
["Everton","Manchester United","6 Sep • 14:00"],
["Arsenal","Chelsea","6 Sep • 16:30"]
];
const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, me=localStorage.getItem("pl_player")||"", claimed=false;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function start(){
  // Render the visible game immediately, before any backend/auth checks.
  renderPlayers();
  renderFixtures();
  document.getElementById("leaderboard").innerHTML =
    PLAYERS.map(p=>`<tr><td>${p}</td><td>0</td></tr>`).join("");

  let auth = await sb.auth.getSession();
  user = auth.data.session?.user || null;

  if(!user){
    const r=await sb.auth.signInAnonymously();
    if(r.error){
      document.getElementById("notice").innerHTML =
        "<b>Game loaded, but shared submissions are not connected yet.</b><br>" +
        "<span class='small'>Anonymous sign-ins need to be enabled in Supabase before predictions can be submitted.</span>";
      document.getElementById("claimStatus").innerHTML =
        "<span style='color:#b00020'>Names are visible, but choosing a player will not work until Supabase anonymous sign-in is enabled.</span>";
      document.getElementById("submitBtn").disabled = true;
      return;
    }
    user=r.data.user;
  }

  await refresh();
}
function renderPlayers(){
  document.getElementById("players").innerHTML=PLAYERS.map(p=>`<button class="${p===me?'active':''}" onclick="choose('${p}')">${p}</button>`).join("");
}
async function choose(p){
  if(!user){
    document.getElementById("claimStatus").innerHTML =
      "<span style='color:#b00020'>Shared login is not connected yet. Enable Anonymous sign-ins in Supabase first.</span>";
    return;
  }
  me=p;localStorage.setItem("pl_player",p);renderPlayers();
  const {error}=await sb.from("pl_player_claims").insert({game_id:GAME_ID,player:p,user_id:user.id});
  if(error && !String(error.message).includes("duplicate")) {
    document.getElementById("claimStatus").innerHTML='<span style="color:#b00020">That name is already claimed. Choose another.</span>';
    me=""; localStorage.removeItem("pl_player"); renderPlayers(); return;
  }
  claimed=true;
  document.getElementById("claimStatus").textContent="Name locked to this browser for this game.";
  await loadOwn();
}
function renderFixtures(values=[]){
  document.getElementById("fixtures").innerHTML=FIXTURES.map((f,i)=>`<div class="match"><div><div class="teams">${f[0]} v ${f[1]}</div><div class="kick">${f[2]}</div></div><div class="score"><input id="h${i}" type="number" min="0" max="20" value="${values[i]?.[0]??''}"><input id="a${i}" type="number" min="0" max="20" value="${values[i]?.[1]??''}"></div></div>`).join("");
}
async function loadOwn(){
  if(!me)return;
  const {data,error}=await sb.from("pl_predictions").select("predictions,submitted_at").eq("game_id",GAME_ID).eq("player",me).eq("user_id",user.id).maybeSingle();
  if(data){renderFixtures(data.predictions);document.getElementById("status").innerHTML='<div class="ok">🔒 Your predictions are locked in.</div>';document.getElementById("submitBtn").disabled=true;}
}
async function submit(){
  if(!me){alert("Choose your name first.");return;}
  const vals=FIXTURES.map((_,i)=>[document.getElementById("h"+i).value,document.getElementById("a"+i).value]);
  if(vals.some(x=>x[0]===""||x[1]==="")){alert("Please enter a score for every match.");return;}
  if(Date.now()>=REVEAL_AT.getTime()){alert("The reveal has already happened.");return;}
  const {error}=await sb.from("pl_predictions").insert({game_id:GAME_ID,player:me,user_id:user.id,predictions:vals,pin_hash:"shared-app"});
  if(error){document.getElementById("status").innerHTML='<div class="warn">❌ '+esc(error.message)+'</div>';return;}
  document.getElementById("status").innerHTML='<div class="ok">✅ Predictions submitted and locked. They cannot be changed.</div>';
  document.getElementById("submitBtn").disabled=true;
}
async function refresh(){
  const revealed=Date.now()>=REVEAL_AT.getTime();
  const d=document.getElementById("notice");
  if(revealed)d.innerHTML="🎉 <b>Predictions are now revealed!</b>";
  else {
    const mins=Math.max(0,Math.ceil((REVEAL_AT-Date.now())/60000));
    d.innerHTML=`🔒 Predictions are hidden until <b>Friday 4 September at 8:00pm</b>.<br><span class="small">${mins} minutes remaining.</span>`;
  }
  await loadOwn();
  if(revealed){
    const {data}=await sb.from("pl_predictions").select("player,predictions").eq("game_id",GAME_ID);
    const map=Object.fromEntries((data||[]).map(x=>[x.player,x.predictions]));
    document.getElementById("reveal").innerHTML=PLAYERS.map(p=>`<h3>${p}</h3>`+((map[p]||[]).map((v,i)=>`<div class="revealRow"><span>${esc(FIXTURES[i][0])} v ${esc(FIXTURES[i][1])}</span><b>${v[0]} - ${v[1]}</b><span></span></div>`).join("")||"<p class='small'>No submission.</p>")).join("");
  } else document.getElementById("reveal").innerHTML="<p>Nothing is visible yet.</p>";
}
document.getElementById("submitBtn").onclick=submit;
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||user;});
start();
setInterval(refresh,15000);
</script>
</body></html>
